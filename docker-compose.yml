# ===========================================
# PizzaHub — Production Docker Compose
# ===========================================
# Usage:
#   docker compose up --build -d
#
# Requires:
#   - backend/.env with production values
#   - MongoDB Atlas (or external MongoDB)
# ===========================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pizzahub-backend
    restart: unless-stopped
    ports:
      - "${PORT:-5001}:5001"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - pizzahub-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5001/api}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:5001}
        VITE_RAZORPAY_KEY: ${VITE_RAZORPAY_KEY:-}
    container_name: pizzahub-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pizzahub-net

networks:
  pizzahub-net:
    driver: bridge
