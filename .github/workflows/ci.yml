name: PizzaHub CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Frontend CI ───
  frontend:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.com/api
          VITE_SOCKET_URL: https://api.example.com
          VITE_RAZORPAY_KEY: rzp_test_placeholder

      - name: Verify PWA artifacts
        run: |
          echo "Checking build artifacts..."
          ls -la dist/
          test -f dist/sw.js && echo "✅ Service Worker generated" || echo "❌ Service Worker missing"
          test -f dist/index.html && echo "✅ index.html present" || echo "❌ index.html missing"

  # ─── Backend CI ───
  backend:
    name: Backend — Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate syntax (dry-run start)
        run: node --check src/app.js
        env:
          NODE_ENV: test
          PORT: 5001
          MONGO_URI: mongodb://localhost:27017/pizzahub_test
          JWT_SECRET: ci_test_secret
          CLIENT_URL: http://localhost:5173

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true

  # ─── Docker Build Verification ───
  docker:
    name: Docker — Build Verification
    runs-on: ubuntu-latest
    needs: [frontend, backend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t pizzahub-backend:ci ./backend

      - name: Build frontend image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=https://api.example.com/api \
            --build-arg VITE_SOCKET_URL=https://api.example.com \
            --build-arg VITE_RAZORPAY_KEY=rzp_test_placeholder \
            -t pizzahub-frontend:ci ./frontend

      - name: Verify images
        run: |
          docker images | grep pizzahub
          echo "✅ Docker images built successfully"
